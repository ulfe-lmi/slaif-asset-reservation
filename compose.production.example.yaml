services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: slaif_reservation
      POSTGRES_USER: slaif
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slaif -d slaif_reservation"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/secrets/postgres_password:/run/secrets/postgres_password:ro

  app:
    image: slaif-asset-reservation:internal-alpha
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./deploy/env.production
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      gunicorn slaif_reservation.config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --access-logfile -
      --error-logfile -
    read_only: true
    tmpfs:
      - /tmp
    user: "10001:10001"

volumes:
  postgres-data:
