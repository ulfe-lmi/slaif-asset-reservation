services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: slaif_reservation
      POSTGRES_USER: slaif
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slaif -d slaif_reservation"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/secrets/postgres_password:/run/secrets/postgres_password:ro

  app:
    image: slaif-asset-reservation:internal-alpha
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./deploy/env.production
        required: false
    ports:
      - "127.0.0.1:${SLAIF_APP_HOST_PORT:-8000}:8000"
    command: >
      gunicorn slaif_reservation.config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --access-logfile -
      --error-logfile -
    read_only: true
    tmpfs:
      - /tmp
    user: "10001:10001"
    healthcheck:
      # Production settings set SECURE_SSL_REDIRECT and trust X-Forwarded-Proto;
      # the header is what makes this same probe correct with or without a real
      # TLS-terminating reverse proxy (the slim image has no curl).
      test: ["CMD-SHELL", "python -c 'import urllib.request as u; u.urlopen(u.Request(\"http://127.0.0.1:8000/health/live\", headers={\"X-Forwarded-Proto\": \"https\"}), timeout=5)'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:
