name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_full_rehearsal:
        description: Run the full production-shaped deployment rehearsal (opt-in, used at deployment-gate time)
        type: boolean
        default: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: git diff --check

  test:
    name: test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17@sha256:d13db94ae661d517c5ed57c509a578d5ea64aae639871ba25294f4f42d83de28
        env:
          POSTGRES_DB: slaif_reservation
          POSTGRES_USER: slaif
          POSTGRES_PASSWORD: slaif
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slaif -d slaif_reservation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://slaif:slaif@localhost:5432/slaif_reservation
      TEST_DATABASE_URL: postgres://slaif:slaif@localhost:5432/slaif_reservation
      DJANGO_SETTINGS_MODULE: slaif_reservation.config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true
      - run: uv sync --locked --all-groups
      # pg_dump/pg_restore on the host: the ubuntu-24.04 runner has no pg client
      # tools by default (only the postgres:17 service image has them). Install
      # the PostgreSQL 17 client from the official PGDG repository so the client
      # matches the server-17 dump format used by the restore_drill test, and
      # pin /usr/local/bin so the 17 tools are deterministically on PATH.
      - name: Install postgresql-client-17
        run: |
          sudo sh -c "curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg"
          echo "deb http://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-17
          sudo ln -sf /usr/lib/postgresql/17/bin/pg_dump /usr/local/bin/pg_dump
          sudo ln -sf /usr/lib/postgresql/17/bin/pg_restore /usr/local/bin/pg_restore
          pg_dump --version
          pg_restore --version
      - run: uv run playwright install --with-deps chromium
      - run: uv run python manage.py migrate --noinput
      - run: uv run python manage.py import_bootstrap_assets --input data/bootstrap/assets.yaml
      - run: uv run python manage.py operational_check
      - run: uv run python manage.py purge_expired_idempotency_records
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py check
      - run: mkdir -p build/openapi
      - run: uv run python manage.py spectacular --file build/openapi/schema.yaml --validate --fail-on-warn
      - run: uv run pytest

  security:
    name: security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run pip-audit
      - run: |
          set +e
          PYTHONPATH=src uv run python - <<'PY'
          import os
          os.environ["DJANGO_SETTINGS_MODULE"] = "slaif_reservation.config.settings.production"
          import django
          django.setup()
          PY
          test "$?" -ne 0

  container:
    name: container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: deploy/rehearse_internal_alpha_deployment.sh --config-only
      - name: Production compose renders with the app healthcheck
        run: |
          # The documented install path relies on the app healthcheck in the
          # production-shaped example; production settings set
          # SECURE_SSL_REDIRECT and trust X-Forwarded-Proto, so the probe must
          # send it. Guard the rendered config, not just that it renders.
          docker compose -f compose.production.example.yaml config --format json \
            > /tmp/rendered-production-compose.json
          python3 - /tmp/rendered-production-compose.json <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              config = json.load(handle)
          hc = config["services"]["app"].get("healthcheck") or {}
          cmd = " ".join(hc.get("test", []))
          if not cmd:
              raise SystemExit("app healthcheck missing")
          if "X-Forwarded-Proto" not in cmd or "https" not in cmd:
              raise SystemExit("app healthcheck probe lacks X-Forwarded-Proto: https")
          PY
      - run: docker build --tag slaif-asset-reservation:ci .
      - run: test "$(docker image inspect slaif-asset-reservation:ci --format '{{.Config.User}}')" = "10001:10001"
      - run: docker run --rm --entrypoint test slaif-asset-reservation:ci -f /app/staticfiles/web/site.css
      - run: docker run --rm --entrypoint test slaif-asset-reservation:ci -f /app/staticfiles/admin/css/base.css
      - run: docker run --rm --entrypoint test slaif-asset-reservation:ci -f /app/staticfiles/drf_spectacular_sidecar/swagger-ui-dist/swagger-ui-bundle.js
      - run: docker run --rm --entrypoint test slaif-asset-reservation:ci -f /app/data/bootstrap/assets.yaml
      - run: docker run --rm --entrypoint test slaif-asset-reservation:ci -f /app/data/bootstrap/assets.schema.json
  deployment-rehearsal:
    name: deployment-rehearsal
    if: github.event == 'workflow_dispatch' && inputs.run_full_rehearsal
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: deploy/rehearse_internal_alpha_deployment.sh
