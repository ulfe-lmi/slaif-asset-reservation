services:
  db:
    image: postgres:17@sha256:d13db94ae661d517c5ed57c509a578d5ea64aae639871ba25294f4f42d83de28
    environment:
      POSTGRES_DB: slaif_reservation
      POSTGRES_USER: slaif
      POSTGRES_PASSWORD: slaif
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slaif -d slaif_reservation"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: slaif_reservation.config.settings.local
      SLAIF_DJANGO_SECRET_KEY: local-compose-only-secret
      SLAIF_DEBUG: "false"
      SLAIF_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      SLAIF_CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      SLAIF_ENABLE_API_DOCS: "true"
      SLAIF_PUBLIC_API_DOCS: "false"
      DATABASE_URL: postgres://slaif:slaif@db:5432/slaif_reservation
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      gunicorn slaif_reservation.config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --threads 8
      --keep-alive 5
      --timeout 30

volumes:
  postgres-data:
